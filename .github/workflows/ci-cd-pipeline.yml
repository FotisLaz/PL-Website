name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      # Test profile: H2 database and in-memory cache, so no Postgres or Redis is needed
      - name: Run tests
        run: ./mvnw -B test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: Backend/target/surefire-reports/

  data-processor:
    name: Data processor tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      # The data processor has no wrapper of its own, so it uses the Backend one
      - name: Run tests
        run: ./mvnw -B -f data-processor-service/pom.xml test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: data-processor-surefire-reports
          path: Backend/data-processor-service/target/surefire-reports/

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false

      # CI=true (set by GitHub Actions) makes ESLint warnings fail the build
      - name: Build
        run: npm run build

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Builds all 4 images (backend, data processor, frontend, scraper); nothing is pushed
      - name: Build images
        run: docker compose --profile scraper build
