spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/prem_stats}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# REDIS CONFIGURATION
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=6379
# Cached player queries expire, so rows written by the data processor show up (e.g. 10m, 30s, 1h)
spring.cache.redis.time-to-live=${CACHE_TTL:10m}

# Match prediction: predict.py and the model trained at image build (see Backend/Dockerfile)
prediction.dir=/app/prediction
prediction.python=python
# After this, the Python process is killed and the API returns 503
prediction.timeout-seconds=10

# Actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
